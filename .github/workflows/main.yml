name: daily Algo Trader
on:
  schedule:
    - cron: '25 13 * * *' # Changed to run every day
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Updated to 3.12
      - run: pip install -r requirements.txt
      - run: python algo_trader.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }} # New secret
          EXCHANGE_SECRET: ${{ secrets.EXCHANGE_SECRET }} # New secret
